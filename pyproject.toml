[project]
name = "meals"
description = "For managing household meal plans."
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "aiosqlite>=0.22.1",
  "alembic>=1.20.0",
  "fastapi[standard]>=0.146.0",
  "fasthx[htmy]>=3.2.2",
  "httpx>=0.28.1",
  "pydantic>=2.14.1",
  "pydantic-yaml>=1.7.0",
  "python-multipart>=0.0.32",
  "rich>=15.0.0",
  "sqlalchemy[asyncio]>=2.1.5",
  "typer>=0.27.3",
]
license = "MIT"
authors = [{ name = "Benjamin Askew-Gale" }]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "typing" },
]
lint = ["import-linter>=2.15", "ruff>=0.17.1"]
test = [
  "pytest>=9.1.1",
  "pytest-randomly>=5.0.0",
  "pytest-cov>=7.1.0",
  "pytest-asyncio>=1.4.0",
  "inline-snapshot>=0.36.1",
  "time-machine>=3.5.1",
]
typing = ["pyrefly>=1.4.0"]
typing-test = [{ include-group = "test" }, { include-group = "typing" }]

[project.scripts]
meals-plan = "meals.cli.plan_meal:app"
meals-seed = "meals.cli.populate_db:app"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "ANN401", "D101", "FIX002", "TD", "DTZ", "CPY001"]

[tool.ruff.lint.per-file-ignores]
# Ignore all directories named `tests`.
# B009/B010: tests read and write the dynamic attributes `logging` stores for
# `extra=`, which `LogRecord` does not declare.
"tests/**" = ["D", "S", "ANN", "PLR2004", "B009", "B010"]
# Alembic's env.py and autogenerated migrations: keep them working rather than
# idiomatic (boolean/type-checking imports and docstring style are not worth it).
"migrations/**" = ["INP001", "D415", "TC002", "TC003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.report]
exclude_also = [
  "if t.TYPE_CHECKING",
  "@t.overload",
  "@abstractmethod",
  "if TYPE_CHECKING",
  "def __repr__",
]
show_missing = true
omit = ["main.py"]

[tool.coverage.run]
branch = true

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning::",         # ignore deprecations from all modules
  "default::DeprecationWarning:meals.*:", # except from our own package
  "ignore::UserWarning",
]
addopts = "--cov=src/ --cov-report="
asyncio_mode = "auto"

[tool.importlinter]
root_package = "meals"

# The HTTP layers are peers; both sit above the application layer, which sits
# above persistence. `meals.auth` is an application-layer dependency (it reads
# the user repository and is consumed by the API and web layers), so it lives
# alongside `meals.services` and may not be imported by the database.
[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
  "meals.api | meals.web",
  "meals.services | meals.auth",
  "meals.database",
]

# The remaining core/infrastructure modules are deliberately outside the
# contract above, so state explicitly that none of them may reach up into the
# HTTP, use-case, or CLI layers (or the application composition root).
[[tool.importlinter.contracts]]
name = "Core modules do not depend on upper layers"
type = "forbidden"
source_modules = [
  "meals.database",
  "meals.schemas",
  "meals.exceptions",
  "meals.settings",
  "meals.logging_config",
  "meals.middleware",
  "meals.error_handlers",
  "meals.constants",
]
forbidden_modules = [
  "meals.api",
  "meals.web",
  "meals.app",
  "meals.services",
  "meals.auth",
  "meals.cli",
]

[tool.inline-snapshot]
format-command = "uv run ruff format --stdin-filename {filename}"

[tool.pyrefly]
preset = "strict"
search-path = ["src", "."]
project-includes = ["src", "tests"]
project-excludes = ["**/build*"]
check-unannotated-defs = true

# Mypy's `strict` bundle enables these; Pyrefly's `strict` preset does not.
[tool.pyrefly.errors]
no-any-return = "error"
incompatible-comparison = "error"
untyped-function-decorator = "error"
untyped-class-decorator = "error"
implicit-reexport = "error"

# Mirrors the old `[[tool.mypy.overrides]]` for `tests.*`: bodies are still checked,
# but tests need not annotate every fixture or parameter.
[[tool.pyrefly.sub-config]]
matches = "tests/**"
[tool.pyrefly.sub-config.errors]
implicit-any = "ignore"
